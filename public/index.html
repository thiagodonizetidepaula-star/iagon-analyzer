<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iagon Analyzer</title><style>*{box-sizing:border-box}body{background:#090f1e;color:#e5edf9;font:16px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:24px}section,article{background:#121d30;border:1px solid #25354c;border-radius:16px;padding:18px;margin:12px 0}h1{color:#69d5ff}small{color:#a8b8cd}button,input,select{background:#20334c;color:white;border:1px solid #40536d;border-radius:8px;padding:12px;margin:4px}button{cursor:pointer}input{max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.grid article{margin:0}canvas{width:100%;height:250px}strong{color:#69d5ff}</style><main><h1>IAGON / ANALYZER</h1><small>Laboratório de análise técnica • somente simulação</small><section><input id="url" placeholder="URL wss pública autorizada"><button id="connect">Conectar</button><button id="stop">Desconectar</button><button id="demo">Simular</button><input type="file" id="file" accept=".json,.txt"><p id="status">Desconectado — nenhum dado real</p></section><section><h2 id="asset">—</h2><strong id="price">—</strong><canvas id="chart" width="1000" height="250"></canvas><p id="history">0 velas fechadas</p></section><div class="grid" id="agents"></div><section><h2 id="signal">AGUARDAR</h2><p id="reason">Histórico insuficiente</p><select id="expiry"><option value="1">1 minuto</option><option value="3">3 minutos</option><option value="5" selected>5 minutos</option></select><button id="analyze">Analisar</button><button id="reset">Zerar placar</button><p id="score"></p><p id="timer">—</p></section><small>Não envia ordens. Pontuações são regras técnicas, não probabilidades de acerto. Dados simulados não representam a Iagon.</small></main><script>const $=id=>document.getElementById(id), names=['Sirius • tendência','Aurora • RSI','Vega • regiões','Zenith • velas','Orion • impulso','Nova • confluência'];let ws,sim,bars=[],current=null,symbol='',mode='',last=0,trade=null,w=0,l=0,e=0,latest=0;function resetData(){bars=[];current=null;symbol='';trade=null;latest=0;render()}function stop(){if(ws){ws.onclose=null;ws.onmessage=null;ws.close();ws=null}clearInterval(sim);sim=null;mode='';$('status').textContent='Desconectado';trade=null}function tick(s,t,p){if(typeof s!=='string'||!Number.isFinite(t)||!Number.isFinite(p)||p<=0)return;if(symbol&&s!==symbol)return;symbol=s;if(t<latest)return;latest=t;last=p;let m=Math.floor(t/60000)*60000;if(!current||m>current.t){if(current){if(m-current.t>60000)bars=[];else bars.push(current);bars=bars.slice(-500)}current={t:m,o:p,h:p,l:p,c:p}}else{current.h=Math.max(current.h,p);current.l=Math.min(current.l,p);current.c=p}if(trade&&t>=trade.end){let d=(p-trade.p)*trade.dir;if(d>0)w++;else if(d<0)l++;else e++;trade=null}render()}function message(x){if(x&&x.y==='t'&&Array.isArray(x.k))for(const a of x.k)if(Array.isArray(a))tick(x.s,a[0],a[1])}function calc(){if(bars.length<50)return null;let c=bars.map(b=>b.c),p=c.at(-1),prev=c.at(-2),avg=a=>a.reduce((x,y)=>x+y,0)/a.length,sma=avg(c.slice(-10)),ema=avg(c.slice(0,50));for(let x of c.slice(50))ema+=(x-ema)*2/51;let a=c.slice(-20),mid=avg(a),sd=Math.sqrt(avg(a.map(x=>(x-mid)**2))),lo=mid-2*sd,hi=mid+2*sd,g=0,d=0;for(let i=c.length-14;i<c.length;i++){let v=c[i]-c[i-1];g+=Math.max(v,0);d+=Math.max(-v,0)}let rsi=g+d?100*g/(g+d):50,b=bars.at(-1),range=bars.slice(-21,-1),sup=Math.min(...range.map(x=>x.l)),res=Math.max(...range.map(x=>x.h));let vote=[p>ema?1:-1,rsi<40?1:rsi>60?-1:0,b.l<=Math.max(lo,sup)&&p>b.o?1:b.h>=Math.min(hi,res)&&p<b.o?-1:0,p>b.o?1:p<b.o?-1:0,p>prev&&p>sma?1:p<prev&&p<sma?-1:0];vote.push(vote.every(x=>x===1)?1:vote.every(x=>x===-1)?-1:0);return {vote,rsi,ema,sma}}function render(){let a=calc();$('asset').textContent=symbol||'—';$('price').textContent=symbol?last.toFixed(5):'—';$('history').textContent=bars.length+' velas fechadas M1';$('agents').replaceChildren(...names.map((n,i)=>{let el=document.createElement('article');let v=a?.vote[i];el.textContent=n+' | '+(v===1?'CALL':v===-1?'PUT':'Aguardar');return el}));$('score').textContent='WIN '+w+' • LOSS '+l+' • Empate '+e+' • Acerto '+(w+l?(100*w/(w+l)).toFixed(1)+'%':'—');$('timer').textContent=trade?Math.max(0,Math.ceil((trade.end-latest)/1000))+' s (tempo dos dados)':'Sem operação simulada';let cv=$('chart'),ctx=cv.getContext('2d'),bs=[...bars.slice(-75),...(current?[current]:[])];ctx.clearRect(0,0,1000,250);if(!bs.length)return;let min=Math.min(...bs.map(b=>b.l)),max=Math.max(...bs.map(b=>b.h)),y=p=>230-(p-min)/(max-min||1)*210;bs.forEach((b,i)=>{let x=12+i*13;ctx.strokeStyle=ctx.fillStyle=b.c>=b.o?'#2dd4a0':'#fb7185';ctx.beginPath();ctx.moveTo(x,y(b.h));ctx.lineTo(x,y(b.l));ctx.stroke();ctx.fillRect(x-4,Math.min(y(b.o),y(b.c)),8,Math.max(1,Math.abs(y(b.o)-y(b.c))))});}$('analyze').onclick=()=>{let a=calc();if(trade)return;if(!mode||!a||!a.vote[5]){$('signal').textContent='AGUARDAR';$('reason').textContent='Sem consenso ou histórico insuficiente';return}$('signal').textContent=a.vote[5]===1?'CALL experimental':'PUT experimental';$('reason').textContent='Consenso técnico; sem garantia de resultado';trade={p:last,dir:a.vote[5],end:latest+Number($('expiry').value)*60000};render()};$('reset').onclick=()=>{w=l=e=0;trade=null;render()};$('stop').onclick=stop;$('connect').onclick=()=>{stop();resetData();try{let u=new URL($('url').value);if(u.protocol!=='wss:')throw Error();mode='websocket';ws=new WebSocket(u);ws.onopen=()=>$('status').textContent='Socket aberto; aguardando cotações';ws.onmessage=ev=>{try{message(JSON.parse(ev.data));if(symbol)$('status').textContent='Recebendo dados • '+symbol}catch{}};ws.onerror=()=>$('status').textContent='Falha de conexão';ws.onclose=()=>{mode='';trade=null;$('status').textContent='Conexão encerrada'}}catch{$('status').textContent='Informe URL wss autorizada'}};$('demo').onclick=()=>{stop();resetData();mode='demo';$('status').textContent='SIMULAÇÃO • dados artificiais';let p=2200,t=Date.now()-60*60000;for(let i=0;i<61;i++){for(let j=0;j<4;j++){p+=Math.random()*4-2;tick('DEMO',t+i*60000+j*10000,p)}}sim=setInterval(()=>{p+=Math.random()*4-2;tick('DEMO',Math.max(Date.now(),latest+1000),p)},1000)};$('file').onchange=async ev=>{stop();resetData();mode='arquivo';try{let raw=await ev.target.files[0].text();let items;try{items=JSON.parse(raw);if(!Array.isArray(items))items=[items]}catch{items=raw.trim().split('\n').map(JSON.parse)}items.forEach(message);$('status').textContent='Arquivo local • '+symbol}catch{$('status').textContent='Arquivo inválido'}};render();</script></html>
